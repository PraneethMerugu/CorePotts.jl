name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      localmath_ref:
        description: LOCALMATH candidate revision
        type: string
        default: f41a37da99c31781d4d2b23678a8e729845306a1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JULIA_VERSION: '1.12.6'
  LOCALMATH_REF: ${{ inputs.localmath_ref || 'f41a37da99c31781d4d2b23678a8e729845306a1' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      execution: ${{ steps.diff.outputs.execution }}
      compiler: ${{ steps.diff.outputs.compiler }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {fetch-depth: 0}
      - name: Select execution checks from the whole PR diff
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          execution=true
          compiler=true
          if [[ "$EVENT" == pull_request ]] && git cat-file -e "$BASE^{commit}" && git cat-file -e "$HEAD^{commit}"; then
            git diff --no-renames --name-only -z "$BASE...$HEAD" > "$RUNNER_TEMP/corepotts-changed-paths"
            execution=false
            compiler=false
            while IFS= read -r -d '' path; do
              case "$path" in
                AGENTS.md|CONTRIBUTING.md|README.md|LICENSE|CITATION.cff|spec/*.md|design/*.md) ;;
                *) execution=true; break ;;
              esac
            done < "$RUNNER_TEMP/corepotts-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/workflows/ci.yml|Project.toml|src/CorePotts.jl|src/execution/*|src/program/*|benchmark/compiler_scaling/*)
                  compiler=true; break ;;
              esac
            done < "$RUNNER_TEMP/corepotts-changed-paths"
          fi
          printf 'execution=%s\n' "$execution" >> "$GITHUB_OUTPUT"
          printf 'compiler=%s\n' "$compiler" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - name: Require immutable sibling revisions
        shell: bash
        run: |
          [[ "$LOCALMATH_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "LOCALMATH_REF must be a full commit SHA"; exit 1; }
      - name: Show selected revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Package tests
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.develop(path="deps/LocalMath"); Pkg.instantiate(); Pkg.test(; test_args=["--jobs=2"])'

  macos-smoke:
    if: github.event_name == 'pull_request'
    name: macos-smoke
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - name: Require immutable sibling revisions
        shell: bash
        run: |
          [[ "$LOCALMATH_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "LOCALMATH_REF must be a full commit SHA"; exit 1; }
      - name: Show selected revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Package smoke tests
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.develop(path="deps/LocalMath"); Pkg.instantiate(); Pkg.test(; test_args=["--jobs=2", "inventory", "api_boundary", "rng_contract", "scientific_reference"])'

  macos-package:
    if: github.event_name != 'pull_request'
    name: macos-package
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - name: Require immutable sibling revisions
        shell: bash
        run: |
          [[ "$LOCALMATH_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "LOCALMATH_REF must be a full commit SHA"; exit 1; }
      - name: Show selected revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Complete macOS package tests
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.develop(path="deps/LocalMath"); Pkg.instantiate(); Pkg.test(; test_args=["--jobs=2"])'

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - name: Require immutable sibling revisions
        shell: bash
        run: |
          [[ "$LOCALMATH_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "LOCALMATH_REF must be a full commit SHA"; exit 1; }
      - name: Show selected revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Build documentation
        run: julia --project=docs --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", ".")]); Pkg.instantiate(); include("docs/make.jl")'

  compiler-evidence:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.compiler != 'false') }}
    name: compiler-evidence
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Require a valid change selection
        if: needs.changes.result != 'success' || (needs.changes.outputs.compiler != 'true' && needs.changes.outputs.compiler != 'false')
        run: exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - name: Require immutable sibling revisions
        shell: bash
        run: |
          [[ "$LOCALMATH_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "LOCALMATH_REF must be a full commit SHA"; exit 1; }
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Resolve the candidate environment
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.develop(path="deps/LocalMath"); Pkg.instantiate()'
      - name: Record lifecycle runtime-boundary evidence
        run: julia --project=. --startup-file=no benchmark/compiler_scaling/lifecycle_runtime_boundaries.jl --revision-label=${{ github.sha }} --evidence-reason=Kaimon-is-not-installed-in-the-CI-evidence-environment > lifecycle-runtime-boundaries.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-runtime-boundaries-${{ github.sha }}
          path: |
            lifecycle-runtime-boundaries.toml
            Manifest.toml

  metal:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.execution != 'false') }}
    name: metal
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Require a valid change selection
        if: needs.changes.result != 'success' || (needs.changes.outputs.execution != 'true' && needs.changes.outputs.execution != 'false')
        run: exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - name: Require immutable sibling revisions
        shell: bash
        run: |
          [[ "$LOCALMATH_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "LOCALMATH_REF must be a full commit SHA"; exit 1; }
      - name: Show selected revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Metal qualification
        run: julia --project=test/metal --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", ".")]); Pkg.instantiate(); include("test/metal/runtests.jl")'
