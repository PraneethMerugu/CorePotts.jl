name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      localmath_ref:
        description: LOCALMATH candidate revision
        type: string
        default: f41a37da99c31781d4d2b23678a8e729845306a1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JULIA_VERSION: '1.12.6'
  LOCALMATH_REF: ${{ inputs.localmath_ref || '22e7b42905522e53e04b4c0febadb96e30189a80' }}
  COREPOTTS_TELEMETRY_DIR: corepotts-telemetry

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      execution: ${{ steps.diff.outputs.execution }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {fetch-depth: 0}
      - name: Select execution checks from the whole PR diff
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          execution=true
          if [[ "$EVENT" == pull_request ]] && git cat-file -e "$BASE^{commit}" && git cat-file -e "$HEAD^{commit}"; then
            git diff --no-renames --name-only -z "$BASE...$HEAD" > "$RUNNER_TEMP/corepotts-changed-paths"
            execution=false
            while IFS= read -r -d '' path; do
              case "$path" in
                AGENTS.md|CONTRIBUTING.md|README.md|LICENSE|CITATION.cff|spec/*.md|design/*.md) ;;
                *) execution=true; break ;;
              esac
            done < "$RUNNER_TEMP/corepotts-changed-paths"
          fi
          printf 'execution=%s\n' "$execution" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - name: Require immutable sibling revisions
        shell: bash
        run: |
          [[ "$LOCALMATH_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "LOCALMATH_REF must be a full commit SHA"; exit 1; }
      - name: Show selected revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Resolve package environment
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: julia --startup-file=no .github/scripts/run-phase.jl environment-resolution julia --project=. --startup-file=no -e 'using Pkg; Pkg.develop(path="deps/LocalMath"); Pkg.instantiate()'
      - name: Precompile package environment
        run: julia --startup-file=no .github/scripts/run-phase.jl dependency-precompile julia --project=. --startup-file=no -e 'using Pkg; Pkg.precompile()'
      - name: Import package
        run: julia --startup-file=no .github/scripts/run-phase.jl package-import julia --project=. --startup-file=no -e 'using CorePotts'
      - name: Package tests
        shell: bash
        run: |
          set -o pipefail
          julia --startup-file=no .github/scripts/run-phase.jl package-tests julia --project=. --startup-file=no -e 'using Pkg; Pkg.test(; test_args=["--jobs=2"])' 2>&1 | tee "$COREPOTTS_TELEMETRY_DIR/parallel-test-runner.log"
      - name: Upload package telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corepotts-telemetry-package
          path: ${{ env.COREPOTTS_TELEMETRY_DIR }}
          if-no-files-found: warn

  macos-smoke:
    if: github.event_name == 'pull_request'
    name: macos-smoke
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - name: Require immutable sibling revisions
        shell: bash
        run: |
          [[ "$LOCALMATH_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "LOCALMATH_REF must be a full commit SHA"; exit 1; }
      - name: Show selected revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Resolve package environment
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: julia --startup-file=no .github/scripts/run-phase.jl environment-resolution julia --project=. --startup-file=no -e 'using Pkg; Pkg.develop(path="deps/LocalMath"); Pkg.instantiate()'
      - name: Precompile package environment
        run: julia --startup-file=no .github/scripts/run-phase.jl dependency-precompile julia --project=. --startup-file=no -e 'using Pkg; Pkg.precompile()'
      - name: Package smoke tests
        shell: bash
        run: |
          set -o pipefail
          julia --startup-file=no .github/scripts/run-phase.jl package-smoke-tests julia --project=. --startup-file=no -e 'using Pkg; Pkg.test(; test_args=["--jobs=2", "inventory", "api_boundary", "rng_contract", "scientific_reference"])' 2>&1 | tee "$COREPOTTS_TELEMETRY_DIR/parallel-test-runner.log"
      - name: Upload macOS smoke telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corepotts-telemetry-macos-smoke
          path: ${{ env.COREPOTTS_TELEMETRY_DIR }}
          if-no-files-found: warn

  macos-package:
    if: github.event_name != 'pull_request'
    name: macos-package
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - name: Require immutable sibling revisions
        shell: bash
        run: |
          [[ "$LOCALMATH_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "LOCALMATH_REF must be a full commit SHA"; exit 1; }
      - name: Show selected revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Resolve package environment
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: julia --startup-file=no .github/scripts/run-phase.jl environment-resolution julia --project=. --startup-file=no -e 'using Pkg; Pkg.develop(path="deps/LocalMath"); Pkg.instantiate()'
      - name: Precompile package environment
        run: julia --startup-file=no .github/scripts/run-phase.jl dependency-precompile julia --project=. --startup-file=no -e 'using Pkg; Pkg.precompile()'
      - name: Complete macOS package tests
        shell: bash
        run: |
          set -o pipefail
          julia --startup-file=no .github/scripts/run-phase.jl package-tests julia --project=. --startup-file=no -e 'using Pkg; Pkg.test(; test_args=["--jobs=2"])' 2>&1 | tee "$COREPOTTS_TELEMETRY_DIR/parallel-test-runner.log"
      - name: Upload complete macOS telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corepotts-telemetry-macos-package
          path: ${{ env.COREPOTTS_TELEMETRY_DIR }}
          if-no-files-found: warn

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - name: Require immutable sibling revisions
        shell: bash
        run: |
          [[ "$LOCALMATH_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "LOCALMATH_REF must be a full commit SHA"; exit 1; }
      - name: Show selected revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Resolve documentation environment
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: julia --startup-file=no .github/scripts/run-phase.jl environment-resolution julia --project=docs --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", ".")]); Pkg.instantiate()'
      - name: Precompile documentation environment
        run: julia --startup-file=no .github/scripts/run-phase.jl dependency-precompile julia --project=docs --startup-file=no -e 'using Pkg; Pkg.precompile()'
      - name: Build documentation
        run: julia --startup-file=no .github/scripts/run-phase.jl documentation julia --project=docs --startup-file=no -e 'include("docs/make.jl")'
      - name: Upload documentation telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corepotts-telemetry-docs
          path: ${{ env.COREPOTTS_TELEMETRY_DIR }}
          if-no-files-found: warn

  metal:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.execution != 'false') }}
    name: metal
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Require a valid change selection
        if: needs.changes.result != 'success' || (needs.changes.outputs.execution != 'true' && needs.changes.outputs.execution != 'false')
        run: exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - name: Require immutable sibling revisions
        shell: bash
        run: |
          [[ "$LOCALMATH_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "LOCALMATH_REF must be a full commit SHA"; exit 1; }
      - name: Show selected revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Resolve Metal environment
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: julia --startup-file=no .github/scripts/run-phase.jl environment-resolution julia --project=test/metal --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", ".")]); Pkg.instantiate()'
      - name: Precompile Metal environment
        run: julia --startup-file=no .github/scripts/run-phase.jl dependency-precompile julia --project=test/metal --startup-file=no -e 'using Pkg; Pkg.precompile()'
      - name: Metal qualification
        run: julia --startup-file=no .github/scripts/run-phase.jl metal-qualification julia --project=test/metal --startup-file=no -e 'include("test/metal/runtests.jl")'
      - name: Upload Metal telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corepotts-telemetry-metal
          path: ${{ env.COREPOTTS_TELEMETRY_DIR }}
          if-no-files-found: warn
